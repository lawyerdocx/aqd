res:[C('الاستعمال السكني','يقتصر الانتفاع بالعين المؤجرة على السكنى للمستأجر وأسرته، ولا يجوز استعمالها في غير ذلك.'),C('محتويات الوحدة','إن كانت الوحدة مفروشة، يقر المستأجر باستلام محتوياتها المبينة بهذا العقد سليمة، ويلتزم بردها بالحالة ذاتها.')],
com:[C('النشاط التجاري','يقتصر الانتفاع على النشاط المحدد بهذا العقد، ولا يجوز تغييره إلا وفق ما ورد بالعقد وبموافقة كتابية من المؤجر.'),C('التراخيص واشتراطات السلامة','يلتزم المستأجر باستخراج التراخيص اللازمة للنشاط على مسؤوليته، وبالتقيد باشتراطات السلامة والجهات المختصة.'),C('اللافتات والتجهيزات','لا يجوز للمستأجر وضع لافتات أو إعلانات أو إجراء تجهيزات إلا وفق ما يسمح به العقد والقانون.'),C('مسؤولية كل طرف','يتحمل كل طرف الالتزامات والرسوم الخاصة به الناشئة عن العين والنشاط.')],
adm:[C('النشاط الإداري','يقتصر الانتفاع على النشاط الإداري المحدد بهذا العقد، ولا يجوز تغييره إلا بموافقة كتابية من المؤجر.'),C('التراخيص واشتراطات السلامة','يلتزم المستأجر باستخراج التراخيص اللازمة للنشاط والتقيد باشتراطات السلامة.')],
ind:[C('النشاط والتراخيص','يقتصر الانتفاع على النشاط المحدد بهذا العقد، ويلتزم المستأجر باستخراج التراخيص اللازمة، والتقيد باشتراطات السلامة والصناعة والبيئة.')],
agri:[C('الغرض الزراعي','خُصصت الأرض للزراعة فقط، ويلتزم المستأجر بتنظيم أعمال الزراعة والمحاصيل بما لا يخالف القانون.'),C('الري والصرف','يلتزم المستأجر بالمحافظة على مصادر الري والصرف وعدم الإضرار بها أو بالأراضي المجاورة.'),C('المحافظة على التربة','يلتزم المستأجر بالمحافظة على خصوبة التربة وعدم تجريفها أو إقامة منشآت عليها.'),C('رد الأرض والتعديات','يلتزم المستأجر برد الأرض بحدودها ومساحتها، ويبلغ المؤجر فورًا بأي تعدٍّ أو تلفيات.')],
land:[C('استعمال الأرض','لا يجوز للمستأجر إقامة منشآت أو إجراء تغييرات على الأرض إلا بموافقة كتابية من المؤجر ووفقًا للقانون، ويلتزم بردها بحالتها.')]};
function clausesFor(){const c=cat(),k=S.type+'|'+c;if(S.ckey==k&&S.clauses)return;const a=[...CL.common];if(isR()){a.push(...CL.rent);if(CL[c])a.push(...CL[c])}else a.push(...CL.sale,...CL[S.type]);S.clauses=a.map(x=>({t:x.t,x:x.x,on:true}));S.ckey=k;save()}

function E(i){const e=[],r=isR();if(i==0){if(!S.date)e.push('حدد تاريخ العقد');if(!S.subj)e.push('اختر نوع محل التعاقد');if(r&&!S.regime)e.push('حدد النظام القانوني للإيجار')}
if(i==1){if(S.groups.length<2)e.push('أضف طرفين على الأقل');S.groups.forEach((g,gi)=>g.people.forEach((P,pi)=>{const w=`الطرف ${ORD[gi]} - شخص ${pi+1}`;if(!pn(P))e.push(w+': الاسم مطلوب');if(P.kind=='n'&&!/^\d{14}$/.test(String(P.nid||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))))e.push(w+': الرقم القومي يجب أن يتكون من 14 رقمًا');if(P.kind=='f'&&!P.pp)e.push(w+': رقم جواز السفر مطلوب');if(P.kind=='l'&&(!P.cr||!P.rep))e.push(w+': السجل التجاري واسم الممثل القانوني مطلوبان');if(!P.addr)e.push(w+': العنوان مطلوب')}))}
if(i==2){['gov','desc','size'].forEach(k=>{if(!S.prop[k])e.push('حقل مطلوب في بيانات العقار: '+PF.find(f=>f[0]==k)[1].replace(' *',''))})}
if(i==3){if(!r&&!S.fin.total)e.push('أدخل إجمالي الثمن');if(r){if(!S.fin.rent)e.push('أدخل القيمة الإيجارية');if(!S.fin.start||!S.fin.end)e.push('حدد تاريخ البداية والنهاية');else if(S.fin.end<=S.fin.start)e.push('تاريخ النهاية يجب أن يكون بعد البداية');if(!S.fin.renewal)e.push('اختر خيار التجديد صراحةً')}}
return e}
const allE=()=>[0,1,2,3].flatMap(E),pct=()=>Math.round(100*(1-Math.min(allE().length,12)/12));
function W(){const w=[];if(isR()&&S.regime=='unsure')w.push('النظام القانوني للإيجار غير محدد: يلزم التحقق من طبيعة العلاقة والعين المؤجرة ومراجعة محامٍ قبل التوقيع.');if(isR()&&S.regime=='old')w.push('العقد مُحدد كخاضع للقوانين الاستثنائية: لا تُطبَّق بنود الإيجار الجديد دون مراجعة قانونية.');if(S.type=='sale_final')w.push('وصف العقد بأنه نهائي لا ينقل الملكية وحده؛ يلزم استيفاء إجراءات التسجيل والشهر.');const f=S.fin;if(!isR()&&num(f.paid)>num(f.total))w.push('المبلغ المدفوع أكبر من إجمالي الثمن.');if(S.clauses&&!S.clauses.some(c=>c.on))w.push('لم يُحدد أي بند قانوني.');return w}

return j([`السيد/ ${E(P.name)}`,P.nat&&`${E(P.nat)} الجنسية`,P.rel&&`الديانة: ${E(P.rel)}`,P.addr&&`المقيم في ${E(P.addr)}${P.gov?' - '+E(P.gov):''}`,P.kind=='f'?(P.pp&&`ويحمل جواز سفر رقم ${E(P.pp)}${P.iss?' صادر عن '+E(P.iss):''}${P.pexp?' وينتهي في '+E(P.pexp):''}`):(P.nid&&`ويحمل بطاقة رقم قومي ${E(P.nid)}`),P.phone&&`هاتف ${E(P.phone)}`,P.email&&`بريد إلكتروني ${E(P.email)}`,P.share&&`(الحصة: ${E(P.share)})`])};
const tb=a=>{let r='',b=null;const fl=()=>{if(b){r+=`<tr><th>${b[0]}</th><td>${b[1]}</td><td colspan=2></td></tr>`;b=null}};a.forEach(x=>{if(String(x[1]).length>38){fl();r+=`<tr><th>${x[0]}</th><td colspan=3>${x[1]}</td></tr>`}else if(b){r+=`<tr><th>${b[0]}</th><td>${b[1]}</td><th>${x[0]}</th><td>${x[1]}</td></tr>`;b=null}else b=x});fl();return r?`<table class=t><colgroup><col style="width:17%"><col style="width:33%"><col style="width:17%"><col style="width:33%"></colgroup>${r}</table>`:''};
const fmtD=d=>d?new Date(d).toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'}):'';
function title(){return`${TY[S.type]} ${S.subj}`}
function contract(){const R=roles(),r=isR(),c=cat(),dt=S.date?new Date(S.date).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
let h=`<h1>${esc(title())}</h1><p>إنه في يوم ${dt}${S.place?' بـ'+esc(S.place):''} تحرر هذا العقد بين كل من:</p>`;
S.groups.forEach((g,gi)=>{const n=g.people.length;h+=`<p class=pt><b>${ORDF[gi]}:</b> ${g.people.map(pd).join('، و')}، ويُشار إلي${n>1?'هم جميعًا':'ه'} في هذا العقد بصفت${n>1?'هم':'ه'} (${R[g.role]||R[0]}) (الطرف ${ORD[gi]}).</p>`});
h+=`<h3>تمهيد</h3><p>بعد أن أقر الطرفان بأهليتهما القانونية للتعاقد وبصفتهما الموضحة أعلاه، اتفقا على ما يلي:</p>`;
const pr=PF.filter(f=>(!f[2]||f[2](r,c))&&S.prop[f[0]]).map(f=>[f[1].replace(' *',''),esc(S.prop[f[0]]).replace(/\n/g,'<br>')+(f[0]=='size'?' '+esc(S.prop.mu||''):'')]);
let bt='';if(!r){const br=[['e','الشرقي'],['w','الغربي'],['s','القبلي'],['n','البحري']].filter(([k])=>S.prop['b_'+k]||S.prop['l_'+k]).map(([k,n])=>`<tr><th>الحد ${n}</th><td>${esc(S.prop['b_'+k]||'')}</td><td style="text-align:center">${esc(S.prop['l_'+k]||'')}</td></tr>`).join('');if(br)bt=`<p>ويحدّ العقار من الجهات الأربع ما يلي:</p><table class=t><colgroup><col style="width:20%"><col style="width:55%"><col style="width:25%"></colgroup><tr><th>الحد</th><th>وصف الحد</th><th style="text-align:center">الطول (بالمتر)</th></tr>${br}</table>`}
h+=`<h3>أولًا: محل التعاقد</h3><p>يرد هذا العقد على ${esc(S.subj)}، وبياناته على النحو الآتي: ${pr.map(([k,v])=>`<b>${k}:</b> ${v}`).join('، ')}.</p>${bt}`;
const F=S.fin,fr=[];if(r)fr.push(['النظام القانوني للإيجار',{new:'خاضع لأحكام القانون المدني',old:'خاضع لنظام القوانين الاستثنائية',unsure:'يحتاج إلى مراجعة قانونية'}[S.regime]||'']);
FF.filter(f=>fin(f,r)&&F[f[0]]).forEach(f=>fr.push([f[1].replace(' *',''),f[3]=='d'?fmtD(F[f[0]]):esc(F[f[0]]).replace(/\n/g,'<br>')]));
if(!r&&!F.rem&&F.total&&F.paid&&num(F.total)>=num(F.paid))fr.push(['المبلغ المتبقي',(num(F.total)-num(F.paid)).toLocaleString('ar-EG')]);
if(!r&&!F.totalW&&words(F.total))fr.push(['الثمن بالحروف',words(F.total)]);if(r&&!F.rentW&&words(F.rent))fr.push(['القيمة الإيجارية بالحروف',words(F.rent)]);
if(r&&dur(F.start,F.end))fr.push(['مدة العقد',dur(F.start,F.end)]);
let n=0;const add=(t,x)=>{h+=`<div class=cl><div class=ch><span>البند (${++n})${t?' – '+esc(t):''}</span></div><p>${x}</p></div>`};h+=`<h3>ثانيًا: البنود والشروط</h3>`;if(fr.length)add(r?'القيمة الإيجارية ومدة العقد':'الثمن وشروط السداد',fr.map(([k,v])=>`${k}: ${String(v).replace(/<br>/g,' - ')}`).join('، ')+'.');

S.clauses.filter(x=>x.on&&x.x.trim()).forEach(x=>add(x.t,esc(x.x).replace('{place}',esc(S.place||'العقار')).replace(/\n/g,'<br>')));
S.extra.filter(x=>x.t||x.h).forEach(x=>add(x.t,x.h||''));
h+=`<p style="margin-top:5mm">وبذلك حُرر هذا العقد في التاريخ المبين بصدره، وأقر كل طرف بقراءته وفهمه لجميع بنوده وموافقته عليها، وبالتوقيع أدناه.</p><h3>التوقيعات</h3><div class=sg>`;
S.groups.forEach((g,gi)=>g.people.forEach(P=>{h+=`<div><b>${R[g.role]||R[0]} (الطرف ${ORD[gi]})</b><br>${esc(pn(P))}${P.kind=='l'&&P.rep?'<br>يمثلها: '+esc(P.rep):''}<br>التوقيع: ..............</div>`}));h+='</div>';
if(S.wit.length){h+=`<h3>الشهود</h3><div class=sg>`+S.wit.map((w,i)=>`<div><b>الشاهد ${i+1}</b><br>${esc(w.name)}${w.nid?'<br>ر.ق: '+esc(w.nid):''}${w.addr?'<br>'+esc(w.addr):''}<br>التوقيع: ..............</div>`).join('')+'</div>'}
return h}
function s6(){const w=W(),e=allE();return`<div class="card no"><h2>المعاينة والتصدير</h2>${e.length?`<div class=err><b>بيانات ناقصة:</b><br>${e.map(esc).join('<br>')}</div>`:''}${w.map(x=>`<div class=warn>⚠ ${x}</div>`).join('')}<h2 style="font-size:15px">الشهود</h2>${S.wit.map((x,i)=>`<div class=g style="margin-bottom:8px">${I(`wit.${i}.name`,'اسم الشاهد')}${I(`wit.${i}.nid`,'الرقم القومي')}${I(`wit.${i}.addr`,'العنوان')}<button class=d onclick="S.wit.splice(${i},1);save();render()">حذف الشاهد</button></div>`).join('')}<button onclick="S.wit.push({});save();render()">+ إضافة شاهد</button><div class=g style="margin-top:12px">${I('name','اسم الملف قبل التصدير')}</div><label style="flex-direction:row;align-items:center;gap:8px;margin:10px 0"><input type=checkbox style="width:auto" ${S.ack?'checked':''} onchange="S.ack=this.checked;save()"> أقر بأن هذه النماذج أداة مساعدة لإعداد العقود، وأن مراجعة محامٍ مختص ضرورية قبل التوقيع، خصوصًا في التصرفات العقارية التي تتطلب التسجيل أو التوثيق.</label><button class=p onclick="pdf()">تصدير العقد PDF / طباعة</button> <small style="color:var(--mut)">اختر «حفظ بصيغة PDF» من نافذة الطباعة. المقاس A4.</small></div><div class=paper>${contract()}</div>`}
function fit(){const p=$('.paper');if(!p)return;const o=p.style.cssText;p.style.cssText='width:182mm;max-width:none;padding:0;box-shadow:none';const lim=2*271*3.7795*.96;for(let fs=11;fs>=9;fs-=.25){document.documentElement.style.setProperty('--fs',fs+'pt');if(p.offsetHeight<=lim)break}p.style.cssText=o}
function pdf(){if(!S.ack){msg=['وافق على الإقرار القانوني أولًا'];render();return}const t=document.title;document.title=S.name||`${title()} - ${S.groups[0].people.map(pn).filter(Boolean)[0]||''}`;fit();try{print()}catch(e){alert('افتح الصفحة في نافذة مستقلة ثم اضغط Ctrl+P')}document.title=t}
function render(){$('#app').innerHTML=view=='home'?home():wiz()}
render();
</script></body></html>
